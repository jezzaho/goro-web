<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rozkładacz — Schedule Fetcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0f1a;
      --surface:  #131828;
      --card:     #1a2035;
      --border:   #252d45;
      --accent:   #4fe3c1;
      --accent2:  #6c8bff;
      --danger:   #ff5e7e;
      --text:     #e8eaf6;
      --muted:    #6b7399;
      --success:  #4fe3c1;

      --radius-sm: 6px;
      --radius:    12px;
      --radius-lg: 20px;
      --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 16px; }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background mesh ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 80% 10%, rgba(108,139,255,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 80%, rgba(79,227,193,.09) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(24px, 5vw, 64px) clamp(16px, 4vw, 32px);
      gap: 0;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: clamp(32px, 5vw, 56px);
      animation: fadeDown .6s ease both;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .wordmark-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .wordmark-icon svg { width: 20px; height: 20px; fill: #0c0f1a; }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--text) 40%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 5vw, 40px) clamp(20px, 5vw, 44px);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 60px rgba(0,0,0,.5);
      animation: fadeUp .7s .1s ease both;
    }

    /* ── Section blocks ── */
    .section {
      margin-bottom: 32px;
    }
    .section:last-child { margin-bottom: 0; }
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Carrier Grid ── */
    .carrier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .carrier-input { display: none; }

    .carrier-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
      min-height: 100px;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .carrier-label::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(79,227,193,.05));
      opacity: 0;
      transition: opacity var(--transition);
    }
    .carrier-label:hover {
      border-color: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108,139,255,.15);
    }
    .carrier-label:hover::before { opacity: 1; }

    .carrier-input:checked + .carrier-label {
      border-color: var(--accent);
      background: rgba(79,227,193,.07);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(79,227,193,.12);
    }
    .carrier-input:checked + .carrier-label::before { opacity: 1; }

    .carrier-logo { height: 36px; width: 100%; display: flex; align-items: center; justify-content: center; }
    .carrier-logo svg, .carrier-logo img { max-height: 36px; max-width: 90px; object-fit: contain; }
    .carrier-name {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
    }
    .carrier-code {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }
    .carrier-input:checked + .carrier-label .carrier-name { color: var(--text); }

    /* ── Date row ── */
    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) {
      .date-row { grid-template-columns: 1fr; }
    }

    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field-input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 100%;
      color-scheme: dark;
    }
    .field-input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(108,139,255,.15);
    }
    .field-input:invalid.touched {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(255,94,126,.15);
    }

    /* ── Season chips ── */
    .season-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .season-input { display: none; }
    .season-chip {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 8px 20px;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.06em;
    }
    .season-chip:hover {
      border-color: var(--accent2);
      color: var(--text);
    }
    .season-input:checked + .season-chip {
      border-color: var(--accent);
      background: rgba(79,227,193,.1);
      color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
    }
    .toggle-info { display: flex; flex-direction: column; gap: 3px; }
    .toggle-title { font-weight: 600; font-size: 0.92rem; }
    .toggle-desc { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); }

    .toggle-switch { position: relative; flex-shrink: 0; }
    .toggle-switch input { display: none; }
    .toggle-track {
      display: block;
      width: 48px; height: 26px;
      background: var(--border);
      border-radius: 100px;
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform var(--transition), background var(--transition);
    }
    .toggle-switch input:checked + .toggle-track {
      background: rgba(79,227,193,.25);
    }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(22px);
      background: var(--accent);
    }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%;
      padding: 15px 24px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #0c0f1a;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background var(--transition);
    }
    .submit-btn:hover:not(:disabled)::before { background: rgba(255,255,255,.08); }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(79,227,193,.3);
    }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-icon { width: 18px; height: 18px; fill: #0c0f1a; flex-shrink: 0; }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: fadeUp .3s ease both;
    }
    .progress-wrap.visible { display: flex; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-status {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .progress-pct {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 100px;
      transition: width .4s ease;
    }

    /* ── Overlay loader ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(12,15,26,.82);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      animation: fadeIn .2s ease;
    }
    .overlay.visible { display: flex; }
    .spinner {
      width: 52px; height: 52px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .overlay-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ── Toast notifications ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid;
      max-width: 300px;
      animation: slideIn .3s ease;
      pointer-events: all;
    }
    .toast.error { background: rgba(255,94,126,.1); border-color: rgba(255,94,126,.4); color: #ff9eb6; }
    .toast.success { background: rgba(79,227,193,.1); border-color: rgba(79,227,193,.4); color: var(--accent); }

    /* ── Animations ── */
    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:none; } }
    @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes slideIn  { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }
    @keyframes slideOut { from { opacity:1; transform:none; } to { opacity:0; transform:translateX(20px); } }
  </style>
</head>

<!-- Loading Overlay -->
<div class="overlay" id="overlay" role="status" aria-live="polite" aria-label="Ładowanie">
  <div class="spinner"></div>
  <p class="overlay-text">Pobieranie rozkładu…</p>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer" aria-live="assertive"></div>

                </svg>
              </div>
              <span class="carrier-name">Lufthansa</span>
              <span class="carrier-code">LH</span>
            </label>
          </div>

          <div>
            <input class="carrier-input" type="radio" id="c-OS" name="carrier" value="OS" />

<script>
  /* ─── Season Dates ─── */
  const SEASON_DATES = {
    S25: { from: '2025-03-30', to: '2025-10-25' },
    W25: { from: '2025-10-26', to: '2026-03-28' },
    S26: { from: '2026-03-29', to: '2026-10-24' },
    W26: { from: '2026-10-25', to: '2027-03-27' },
  };

  /* ─── DOM refs ─── */
  const form         = document.getElementById('downloadForm');
  const dateFrom     = document.getElementById('date-from');
  const dateTo       = document.getElementById('date-to');
  const downloadBtn  = document.getElementById('downloadBtn');
  const overlay      = document.getElementById('overlay');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressPct  = document.getElementById('progressPct');
  const progressStat = document.getElementById('progressStatus');
  const toastCont    = document.getElementById('toastContainer');
  const seasonRadios = document.querySelectorAll('input[name="season"]');

  /* ─── Season → dates ─── */
  seasonRadios.forEach(r => {
    r.addEventListener('change', e => {
      if (!e.target.checked) return;
      const s = SEASON_DATES[e.target.value];
      dateFrom.value = s.from;
      dateTo.value   = s.to;
      dateFrom.classList.remove('touched');
      dateTo.classList.remove('touched');
    });
  });

  /* Clear season selection on manual date change */
  [dateFrom, dateTo].forEach(inp => {
    inp.addEventListener('change', () => {
      seasonRadios.forEach(r => r.checked = false);
    });
    inp.addEventListener('blur', () => inp.classList.add('touched'));
  });

  /* ─── Toast ─── */
  function showToast(msg, type = 'error', duration = 4000) {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    toastCont.appendChild(el);
    setTimeout(() => {
      el.style.animation = 'slideOut .3s ease forwards';
      el.addEventListener('animationend', () => el.remove());
    }, duration);
  }

  /* ─── Progress helpers ─── */
  function setProgress(pct) {
    progressFill.style.width = `${pct}%`;
    progressPct.textContent  = `${pct}%`;
    if (pct >= 100) progressStat.textContent = 'Gotowe!';
  }

  function setLoading(on) {
    overlay.classList.toggle('visible', on);
    downloadBtn.disabled = on;
    progressWrap.classList.toggle('visible', on);
    if (!on) setProgress(0);
  }

  /* ─── Validation ─── */
  function validate() {
    dateFrom.classList.add('touched');
    dateTo.classList.add('touched');

    if (!dateFrom.value) {
      showToast('Proszę wybrać datę początkową.');
      dateFrom.focus();
      return false;
    }
    if (!dateTo.value) {
      showToast('Proszę wybrać datę końcową.');
      dateTo.focus();
      return false;
    }
    if (dateTo.value < dateFrom.value) {
      showToast('Data końcowa nie może być wcześniejsza niż początkowa.');
      dateTo.focus();
      return false;
    }
    return true;
  }

  /* ─── Form submit ─── */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validate()) return;

    setLoading(true);
    progressStat.textContent = 'Nawiązywanie połączenia…';

    let eventSource = null;

    try {
      /* SSE progress stream */
      eventSource = new EventSource('/progress');
      eventSource.onmessage = ev => {
        const pct = parseInt(ev.data, 10);
        if (!isNaN(pct)) {
          setProgress(pct);
          progressStat.textContent = pct < 100 ? 'Pobieranie danych z API…' : 'Finalizowanie pliku…';
        }
      };
      eventSource.onerror = () => eventSource.close();

      /* POST */
      const payload = new URLSearchParams(new FormData(form)).toString();
      const res = await fetch('/csv', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload,
      });

      if (!res.ok) throw new Error(`Błąd serwera: ${res.status}`);

      /* Filename from header */
      const cd = res.headers.get('Content-Disposition') ?? '';
      const fnMatch = cd.match(/filename="([^"]+)"/);
      const filename = fnMatch ? fnMatch[1] : 'rozklad.csv';

      /* Trigger download */
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(url);
      a.remove();

      setProgress(100);
      showToast('Rozkład pobrany pomyślnie!', 'success');

    } catch (err) {
      console.error(err);
      showToast(`Nie udało się pobrać pliku. ${err.message}`);
    } finally {
      eventSource?.close();
      setTimeout(() => setLoading(false), 800);
    }
  });
</script>
